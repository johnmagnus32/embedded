# machine.conf — the QEMU `-M virt` EMULATOR target (a board, like Yocto's qemuarm / Buildroot's
# qemu_arm defconfig). It is NOT a shippable product board: it exists so the kernel + libc test
# harnesses (kernel/test/golden.sh, libc/test/dynamic.sh) can build a rootfs that runs under
# QEMU. You never `make image` for it — only `make rootfs` (dynamic.sh) / the kernel's own
# MACHINE=virt build (golden.sh).
#
# DUAL-READ (same contract as t113-gameboy/machine.conf): this file is BOTH bash-sourced (lib/
# core.sh) and Make `-include`d (resolve.mk). So it MUST be pure KEY=value — no `source`, no
# `$(...)`, no tabs. (An earlier version `source`d the t113 machine.conf to inherit its BSP; that
# worked for the bash-only callers but broke every `make <target> MACHINE=virt` — Make can't parse
# a shell `source` line, "missing separator". Made standalone here.)
#
# virt differs from t113-gameboy mainly in the arch tune (VFP-free -mgeneral-regs-only, to match the
# custom kernel's user-program ABI under QEMU) and in having NO board DTB — QEMU -M virt is
# self-describing. It also builds a mainline Linux (keys below) as the reference kernel the libc tests
# boot; it needs none of t113's U-Boot / NOR / DRAM keys.

# Build target (the custom kernel's board.h address set). Declared as DATA — the engine never
# infers it from the directory name. "virt" for the QEMU target.
KERNEL_TARGET=virt
ARCH=arm

# The ONE real difference: VFP-free ISA for QEMU virt (matches the kernel's -mgeneral-regs-only
# user code).
ROOTFS_ARCH_FLAGS="-mcpu=cortex-a7 -marm -mgeneral-regs-only"

# --- Mainline Linux for QEMU -M virt (the reference kernel the libc tests boot). multi_v7_defconfig is
# the standard mainline ARM config that boots on virt (PL011 console, virtio, GIC). No KERNEL_DTB — QEMU
# supplies the FDT, so the linux recipe builds a zImage only (no board DTS / overlays).
KERNEL_DEFCONFIG="multi_v7_defconfig"
KERNEL_IMAGE_TARGET="zImage"
KERNEL_CONSOLE="ttyAMA0,115200"
