# configs/virt-musl.conf — QEMU `-M virt` test config: musl + shell init + busybox, static.
# Selected with CONFIG=virt-musl (own build dir build/virt-musl/). MACHINE=virt cascades to
# machine/virt/machine.conf (VFP-free arch). Used by kernel/test/golden.sh; the dynamic case
# adds LINKAGE=dynamic on the command line (LINKAGE is an env-overridable knob).
OS_VIRTUALS=virtual/kernel virtual/bootloader virtual/libc virtual/init virtual/cross-cc virtual/cross-cc-initial

PREFERRED_PROVIDER_virtual/kernel=linux
PREFERRED_PROVIDER_virtual/bootloader=bootloader-custom
PREFERRED_PROVIDER_virtual/libc=musl
PREFERRED_PROVIDER_virtual/init=init-shell
PREFERRED_PROVIDER_virtual/cross-cc=toolchain-gcc
PREFERRED_PROVIDER_virtual/cross-cc-initial=toolchain-gcc-initial

PACKAGES=busybox
MACHINE=virt
MEDIA=nor
LINKAGE=static
