# configs/virt-custom.conf — QEMU `-M virt` test config: our from-scratch libc (libc-custom) +
# shell init + coreutils, static. Selected with CONFIG=virt-custom (build dir build/virt-custom/).
# MACHINE=virt cascades to machine/virt/machine.conf (VFP-free arch). Used by libc/test/on-target/run.sh
# and libc/test/dynamic.sh (the latter adds LINKAGE=dynamic on the command line).
OS_VIRTUALS=virtual/kernel virtual/bootloader virtual/libc virtual/init virtual/cross-cc virtual/cross-cc-initial

PREFERRED_PROVIDER_virtual/kernel=linux
PREFERRED_PROVIDER_virtual/bootloader=bootloader-custom
PREFERRED_PROVIDER_virtual/libc=libc-custom
PREFERRED_PROVIDER_virtual/init=init-shell
PREFERRED_PROVIDER_virtual/cross-cc=toolchain-gcc
PREFERRED_PROVIDER_virtual/cross-cc-initial=toolchain-gcc-initial

PACKAGES=coreutils
MACHINE=virt
MEDIA=nor
LINKAGE=static
