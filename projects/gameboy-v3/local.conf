# local.conf — the gameboy-v3 PRODUCT selection (Yocto's conf/local.conf). Plain bash, read by the
# forge scripts (forge-env.sh), never by Make. Override any knob on the CLI as an ENV var:
#   KERNEL=mainline LIBC=musl PACKAGES=busybox BOOTLOADER=uboot make image   # all-OSS reference
#   KERNEL=custom LIBC=custom TOOLCHAIN=custom INIT=shell PACKAGES=coreutils make   # our own cc/as/ld
# The `:=` defaults keep an env override if one is already set (env wins over the default).
: "${KERNEL:=mainline}"          # mainline -> fetch Linux           | custom -> repo-root kernel/
: "${BOOTLOADER:=custom}"        # custom   -> repo-root bootloader/ | uboot  -> fetch U-Boot
: "${LIBC:=musl}"                # musl     -> fetch + build musl    | custom -> repo-root libc/
: "${TOOLCHAIN:=gcc}"            # gcc      -> from-source GCC        | custom -> our own cc/as/ld
: "${INIT:=custom}"              # custom (C supervisor) | shell | runit
: "${PACKAGES:=busybox console}" # additive rootfs install set (space-separated)
: "${BOARD:=t113-gameboy}"
: "${MEDIA:=nor}"                # nor -> FEL bundle | sd -> dd-able .img
: "${LINKAGE:=static}"           # static | dynamic
export KERNEL BOOTLOADER LIBC TOOLCHAIN INIT PACKAGES BOARD MEDIA LINKAGE

# The abstract slots this product resolves, and — the Yocto DISTRO/MACHINE role — which recipe
# implements each (mapping the human knob to a provider recipe name). The engine reads ONLY this;
# adding a provider is a recipe + a case here, no engine edit.
FORGE_VIRTUALS="virtual/kernel virtual/bootloader virtual/libc virtual/init virtual/cross-cc virtual/cross-cc-initial"
forge_preferred_provider() {
  case "$1" in
    virtual/kernel)           [ "${KERNEL}" = mainline ] && echo linux || echo kernel-custom ;;
    virtual/bootloader)       [ "${BOOTLOADER}" = uboot ] && echo u-boot || echo bootloader-custom ;;
    virtual/libc)             [ "${LIBC}" = custom ] && echo libc-custom || echo "${LIBC}" ;;
    virtual/init)             [ "${INIT}" = runit ] && echo runit || echo "init-${INIT}" ;;
    virtual/cross-cc)         echo "toolchain-${TOOLCHAIN}" ;;
    virtual/cross-cc-initial) [ "${TOOLCHAIN}" = gcc ] && echo toolchain-gcc-initial || echo "toolchain-${TOOLCHAIN}" ;;
    *) return 1 ;;
  esac
}

# Peripherals (LCD, etc.) are NOT knobs — invariant board data under boards/$BOARD/, applied by the board.
