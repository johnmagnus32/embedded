# local.conf — the gameboy-v3 PRODUCT selection. Key=value DATA, parsed by the engine (never sourced).
# Each PREFERRED_PROVIDER_virtual/<slot> names the recipe that provides that slot (Yocto's
# PREFERRED_PROVIDER): the value IS the recipe name — no knob->provider translation. To switch a slot,
# change the recipe name here. PACKAGES/BOARD/MEDIA/LINKAGE are plain knobs (env-overridable: MEDIA=sd make).

OS_VIRTUALS=virtual/kernel virtual/bootloader virtual/libc virtual/init virtual/cross-cc virtual/cross-cc-initial

PREFERRED_PROVIDER_virtual/kernel=linux
PREFERRED_PROVIDER_virtual/bootloader=bootloader-custom
PREFERRED_PROVIDER_virtual/libc=musl
PREFERRED_PROVIDER_virtual/init=init-custom
PREFERRED_PROVIDER_virtual/cross-cc=toolchain-gcc
PREFERRED_PROVIDER_virtual/cross-cc-initial=toolchain-gcc-initial

PACKAGES=busybox console
BOARD=t113-gameboy
MEDIA=nor
LINKAGE=static

# Peripherals (LCD, etc.) are NOT knobs — invariant board data under boards/$BOARD/, applied by the board.
