# image.cfg — declarative SD full-disk layout for t113-gameboy (genimage format).
#
# STATUS: this is the DECLARATIVE description of the MEDIA=sd image, in genimage's
# config language. genimage is NOT installed on the current build host (no apt),
# so forge/image.mk still assembles the .img with the proven dd/sfdisk path in
# scripts/build.sh (emit_sd_img). This file is the board-owned layout that path
# implements — the single place to edit the geometry, and a drop-in for genimage
# once it's available (see docs/LINUX_BUILD_SYSTEM_REFACTOR.md "Genimage dependency").
#
# Layout (matches board/t113-gameboy/layout.env + emit_sd_img):
#   - bootloader (u-boot-sunxi-with-spl.bin OR the custom eGON) raw at 8 KiB
#     (SDIMAGE_UBOOT_SEEK_KB) — the BROM reads the SPL there.
#   - one FAT32 boot partition starting at 1 MiB (SDIMAGE_PART_START_MB) holding
#     zImage + <board>.dtb + initramfs.cpio.gz (+ boot.scr on the U-Boot path).
#   - total image 64 MiB (SDIMAGE_SIZE_MB).

image boot.vfat {
	vfat {
		label = "GBV3BOOT"
		files = {
			"zImage",
			"sun8i-t113s-mangopi-mq-r-t113.dtb",
			"initramfs.cpio.gz",
			"boot.scr",
		}
	}
	size = 63M
}

image sdcard.img {
	hdimage {
	}

	# raw bootloader at the 8 KiB offset the BROM reads (not in any partition)
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		partition-type = 0xC       # FAT32 (LBA)
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	size = 64M
}
