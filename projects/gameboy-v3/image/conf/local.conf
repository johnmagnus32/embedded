# conf/local.conf — the gameboy-v3 PRODUCT selection (Yocto's local.conf), sourced as bash by the engine.
# PROVIDER_<slot>=<recipe> picks the recipe for each swappable slot (kernel/bootloader/libc/init/compiler);
# PACKAGES/MEDIA/LINKAGE are plain knobs — edit them here to change a build (the engine does not env-override
# them). MACHINE is NOT set here — it's the build-time selector (MACHINE=t113 | qemu), required with
# no magical default; it picks conf/machine/$MACHINE.conf and the per-machine build dir (build/$MACHINE).
# Same product software on every machine; only the BSP differs.

PROVIDER_kernel=linux
PROVIDER_bootloader=bootloader-custom
PROVIDER_libc=musl
PROVIDER_init=init-custom
PROVIDER_cross_cc=toolchain-gcc
PROVIDER_cross_cc_initial=toolchain-gcc-initial

PACKAGES="busybox console"
MEDIA=nor
LINKAGE=static

# Peripherals (LCD, etc.) are NOT knobs — invariant board data under conf/machine/$MACHINE.conf.
