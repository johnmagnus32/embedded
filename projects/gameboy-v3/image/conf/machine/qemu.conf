# machine.conf — the QEMU `-M virt` EMULATOR target (a machine, like Yocto's qemuarm / Buildroot's
# qemu_arm defconfig). Selected with MACHINE=qemu: the SAME product software as t113, built for ARM to run
# under qemu-system-arm for hardware-free dev. Standalone — it carries its own keys rather than inheriting
# the t113 BSP (QEMU needs none of t113's U-Boot / NOR / DRAM keys, and self-describes its DTB).
#
# Differs from t113 mainly in the arch tune (VFP-free -mgeneral-regs-only, matching the custom kernel's
# user-program ABI under QEMU) and in having NO board DTB — QEMU -M virt is self-describing. It builds a
# mainline Linux (keys below) suited to -M virt.

# Build target (the custom kernel's board.h address set). DATA — never inferred from the file name. It is
# "virt", QEMU's board name (matches the custom kernel's BOARD=virt + `-M virt`); the MACHINE itself is qemu.
KERNEL_TARGET=virt
ARCH=arm

# The ONE real difference: VFP-free ISA for QEMU virt (matches the kernel's -mgeneral-regs-only
# user code).
ROOTFS_ARCH_FLAGS="-mcpu=cortex-a7 -marm -mgeneral-regs-only"

# --- Mainline Linux for QEMU -M virt (the reference kernel the libc tests boot). multi_v7_defconfig is
# the standard mainline ARM config that boots on virt (PL011 console, virtio, GIC). No KERNEL_DTB — QEMU
# supplies the FDT, so the linux recipe builds a zImage only (no board DTS / overlays).
KERNEL_DEFCONFIG="multi_v7_defconfig"
KERNEL_IMAGE_TARGET="zImage"
KERNEL_CONSOLE="ttyAMA0,115200"
