# board.conf — the QEMU `-M virt` EMULATOR target (a board, like Yocto's qemuarm / Buildroot's
# qemu_arm defconfig). It is NOT a shippable product board: it exists so the kernel + libc test
# harnesses (kernel/test/golden.sh, libc/test/dynamic.sh) can build a rootfs that runs under
# QEMU. You never `make image` for it — only `make rootfs` (dynamic.sh) / the kernel's own
# BOARD=virt build (golden.sh).
#
# DUAL-READ (same contract as t113-gameboy/board.conf): this file is BOTH bash-sourced (lib/
# core.sh) and Make `-include`d (resolve.mk). So it MUST be pure KEY=value — no `source`, no
# `$(...)`, no tabs. (An earlier version `source`d the t113 board.conf to inherit its BSP; that
# worked for the bash-only callers but broke every `make <target> BOARD=virt` — Make can't parse
# a shell `source` line, "missing separator". Made standalone here.)
#
# A rootfs build reads exactly ONE board key — ROOTFS_ARCH_FLAGS — and virt differs from
# t113-gameboy in exactly that key: the arch tune must be VFP-free (-mgeneral-regs-only), to
# match the custom kernel's user-program ABI under QEMU. It needs none of t113's U-Boot / NOR /
# DRAM / mainline-kernel keys (those feed only the OSS provider recipes, which virt never runs),
# so this board is deliberately MINIMAL.

# Build targets (the custom kernel's board.h address set + the rootfs arch target). Declared as
# DATA — the engine never infers them from the directory name. Both are "virt" for the QEMU target.
KERNEL_TARGET=virt
ROOTFS_TARGET=virt

# The ONE real difference: VFP-free ISA for QEMU virt (matches the kernel's -mgeneral-regs-only
# user code). bash-only key — Make parses it into a var it never reads (harmless).
ROOTFS_ARCH_FLAGS="-mcpu=cortex-a7 -marm -mgeneral-regs-only"
