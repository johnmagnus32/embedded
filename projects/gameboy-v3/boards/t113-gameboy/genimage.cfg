# genimage.cfg — the LIVE, authoritative SD full-disk layout for t113-gameboy.
#
# This is the SINGLE SOURCE OF TRUTH for the MEDIA=sd image geometry, consumed
# directly by genimage (the declarative disk-image assembler — Buildroot's tool,
# built from source into build/hosttools/ by forge, since it isn't packaged for
# this host). forge/backends/image.sh (emit_sd_img) stages the inputs, then runs
#   genimage --config genimage.cfg --inputpath <staged bootloader> \
#            --rootpath <staged FAT contents> ...
# and genimage builds the .img. No dd/sfdisk hand-assembly, no parallel geometry
# in board.conf — this file owns it (matches Buildroot's board/<board>/genimage.cfg).
#
# Layout:
#   - the bootloader raw at the 8 KiB offset the BROM reads. image.sh stages the
#     SELECTED loader (u-boot-sunxi-with-spl.bin for BOOTLOADER=uboot, or the
#     custom eGON) into the inputpath under the fixed name `sdboot.bin`.
#   - one bootable FAT32 partition at 1 MiB. Its contents come from the staged
#     rootpath directory (NOT an explicit file list) so the set can vary by
#     bootloader: zImage + <board>.dtb + initramfs.cpio.gz always, plus boot.scr
#     on the U-Boot path (the custom loader doesn't use a U-Boot boot script).
#   - total image 64 MiB.

image boot.vfat {
	vfat {
		label = "GBV3BOOT"
		# No `files`/`file` list: populate from the staged rootpath dir (mountpoint
		# "/"), so a present-or-absent boot.scr just works without editing this cfg.
	}
	mountpoint = "/"
	size = 63M
}

image sdcard.img {
	hdimage {
	}

	# raw bootloader at the 8 KiB offset the BROM reads (not in any partition).
	# image.sh stages the selected loader as `sdboot.bin` in the inputpath.
	partition bootloader {
		in-partition-table = "no"
		image = "sdboot.bin"
		offset = 8K
	}

	partition boot {
		partition-type = 0xC       # FAT32 (LBA)
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	size = 64M
}
