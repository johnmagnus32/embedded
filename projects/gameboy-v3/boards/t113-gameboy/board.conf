# board.conf — t113-gameboy: the SINGLE board config (BSP), consumed two ways:
#   * MAKE (resolve.mk -include) reads ONLY KERNEL_TARGET/ROOTFS_TARGET; every other line
#     parses into a Make var it never reads (harmless).
#   * BASH (lib/core.sh source) reads ALL keys and expands quotes + ${VAR}.
# So keep the two MAKE-read keys BARE (no quotes, no `:=`/`?=`, no inline `#` — a trailing
# comment would leak into the bash value and break the Make comparison); the bash-only keys
# below may quote/interpolate freely. No tabs / $(shell) / rule targets anywhere.

# =============================================================================
# PROVIDER TARGETS  (read by BOTH Make and bash — keep bare)
# =============================================================================
# Which build-target each provider builds for THIS board (the engine bakes in no "t113").
# KERNEL_TARGET selects the custom kernel's board.h address set; ROOTFS_TARGET is the rootfs
# arch target (t113 allows VFP; virt is VFP-free for QEMU). Normally equal.
KERNEL_TARGET=t113
ROOTFS_TARGET=t113

# =============================================================================
# OSS BUILD FACTS  (bash-only — read by the mainline kernel/U-Boot recipes)
# =============================================================================
# Only the mainline/OSS path consumes these; the custom kernel/bootloader carry their own
# board facts in kernel/include/board.h.

# --- U-Boot ------------------------------------------------------------------
UBOOT_DEFCONFIG="mangopi_mq_r_defconfig"
UBOOT_BOARD_DT="sun8i-t113s-mangopi-mq-r-t113"   # control DTB, also shipped for the kernel
# BOARD .config fragment(s) applied after the defconfig (the uboot provider prepends its own
# no-tools default first — see providers/bootloader/uboot/recipe.sh). Within uboot-board.config
# MTD must precede SPI_FLASH — its menu is `if MTD`.
UBOOT_CONFIG_FRAGMENTS="${BOARD_DIR}/uboot-board.config"
# Control-DTB overlays: proper's console -> UART0; declare the W25Q128 so `sf probe` finds it.
UBOOT_DTB_OVERLAYS="uart0-console.dtsi nor-spi.dtsi"

# --- Rootfs arch tuning ------------------------------------------------------
# ISA flags cc-profile compiles every package with — a board/SoC fact (T113-S3 = Cortex-A7),
# so it lives here, not in the engine. ONE arch per board now: the VFP-free QEMU variant is a
# separate board (boards/virt/), selected by BOARD=virt — not an override key here.
ROOTFS_ARCH_FLAGS="-mcpu=cortex-a7 -marm"

# --- Linux kernel ------------------------------------------------------------
KERNEL_DEFCONFIG="sunxi_defconfig"        # 32-bit ARM; 8250_DW UART, MMC_SUNXI, D1/T113 CCU+pinctrl
KERNEL_IMAGE_TARGET="zImage"              # ARMv7 compressed kernel (bootz)
KERNEL_DTB="${UBOOT_BOARD_DT}.dtb"        # bash expands ${UBOOT_BOARD_DT}
KERNEL_DTB_SUBDIR="allwinner"             # arch/arm/boot/dts/allwinner/
# serial0=&uart0 (from the overlay) => Linux names uart0 "ttyS0", so the cmdline console is ttyS0.
KERNEL_CONSOLE="ttyS0,115200"
KERNEL_CONFIG_FRAGMENTS=""   # no board .config deltas today (a peripheral like the LCD adds one)
KERNEL_DTB_OVERLAYS="uart0-console.dtsi"
# A peripheral is board data, not a build knob: append its .dtsi to KERNEL_DTB_OVERLAYS + its
# .config to KERNEL_CONFIG_FRAGMENTS (both applied unconditionally). The ILI9341 SPI LCD is
# specified + ready for the display phase in lcd-ili9341.dtsi + kernel-lcd-ili9341.config here:
#     KERNEL_DTB_OVERLAYS="uart0-console.dtsi lcd-ili9341.dtsi"
#     KERNEL_CONFIG_FRAGMENTS="${BOARD_DIR}/kernel-lcd-ili9341.config"

# =============================================================================
# MEMORY + STORAGE LAYOUT  (bash-only — a board layout choice, not a chip fact)
# =============================================================================
# Only DRAM_BASE 0x40000000 is silicon-pinned; WHERE kernel/DTB/initramfs land is this
# board's choice. NOR offsets must match bootloader/nor_layout.h + the README's SPI-NOR layout.

# --- NOR flash layout (offsets into the on-board W25Q128 SPI-NOR) -------------
NOR_TABLE_OFF=0x000000        # GV3NOR1 component table (custom loader reads this)
NOR_KERNEL_OFF=0x010000       # zImage
NOR_DTB_OFF=0x610000          # board DTB
NOR_INITRD_OFF=0x620000       # initramfs.cpio.gz

# --- DRAM load addresses (match the custom loader + board/*/boot.cmd) ---------
DRAM_KERNEL=0x41000000
DRAM_DTB=0x41800000
DRAM_INITRD=0x41c00000

# The SD image geometry (partition offsets, the 8 KiB bootloader offset) is NOT here — it
# lives in genimage.cfg, which genimage consumes directly (MEDIA=sd path).

