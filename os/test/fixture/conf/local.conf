# local.conf — the fixture product selection: a provider per slot + one package (t-app). Sourced as bash.
# No MACHINE here — it's the build-time selector (the fixture ships conf/machine/testmachine.conf).
PROVIDER_init=t-init
PROVIDER_libc=t-libc
PROVIDER_cross_cc=t-cc
PROVIDER_cross_cc_initial=t-cc-initial

PACKAGES=t-app
MEDIA=nor
LINKAGE=static
